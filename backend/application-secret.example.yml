# 로컬 비밀값 예시. 이 파일을 복사해 backend/application-secret.yml(git 제외)로 만들고 실제 값을 채운다.
# application.yml의 spring.config.import 가 optional:file:./application-secret.yml 을 읽는다(없으면 무시).
# 운영에서는 파일 대신 같은 이름의 환경변수를 준다. 값을 비우면 해당 소셜 로그인·메일 기능이 동작하지 않는다.
